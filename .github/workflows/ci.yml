name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: research_m01_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research_test -d research_m01_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://research_test:ci-test-only@localhost:5432/research_m01_test
      TEST_DATABASE_URL: postgresql://research_test:ci-test-only@localhost:5432/research_m01_test
      JWT_SECRET: ci-only-secret-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run db:generate
      - run: npm run backlog:check
      - run: npm run test:backlog
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:deploy
      - run: npm run test:integration
      - run: npm run build
